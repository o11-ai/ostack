# ostack:example. Replace every value below (or run the ostack-setup skill), then delete this line.
name: b2b-founders
mode: draft
goal: book 15 minute intro calls with founders of small B2B software companies

sender:
  name: Your Name
  title: founder
  email: you@example.com
  signature: |
    your first name

target:
  who: Founders and CEOs of B2B software companies with 1-50 employees
  contact: founder or CEO
  qualify:
    - builds and sells its own software product
    - sells to businesses, not consumers
    - 1-50 employees
    - the contact currently holds a founder or CEO role
  exclude:
    - agencies, consultancies and dev shops
    - companies with no live product or website
    - existing customers and anyone already in conversation with you

sources:
  - type: web
    query: seed and pre-seed B2B software funding announcements from the last 90 days
  - type: web
    query: B2B software product launches on Product Hunt and Hacker News Show HN this month

sequence:
  - channel: email
    wait_days: 0
    brief: first touch built on one observed fact about their business; ask for a 15 minute call
  - channel: email
    wait_days: 3
    brief: same thread; one sharper question drawn from the research notes
  - channel: email
    wait_days: 4
    brief: same thread; offer something small and concrete that would help, keep the call ask
  - channel: email
    wait_days: 7
    brief: same thread; close the loop politely in two sentences

limits:
  new_per_day: 15
  touches_per_day: 45
  per_company: 1
  research_per_run: 25

writing:
  max_words: 110
  banned: ["—", "hope this finds you well", "just checking in", "synergy"]
  rules:
    - casual, mostly lowercase, short paragraphs
    - no links or attachments in the first email
    - ask about pain, never assert it

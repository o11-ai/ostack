# ostack:example. Replace every value below (or run the ostack-setup skill), then delete this line.
name: recruiting
mode: draft
goal: get qualified engineers to a 20 minute intro call about an open role

sender:
  name: Your Name
  title: head of engineering
  email: you@example.com
  linkedin: https://www.linkedin.com/in/your-profile
  signature: |
    your first name

target:
  who: Senior backend engineers with production experience in the role's core stack
  contact: the candidate
  qualify:
    - currently or recently works as a software engineer
    - 5+ years of professional experience
    - public evidence of the required stack (talks, repos, posts or role history)
    - located in, or open to, the role's location
  exclude:
    - current employees and anyone who interviewed with you in the last 12 months
    - people whose profile says they are not open to messages

sources:
  - type: web
    query: engineers who recently spoke or wrote about the role's core stack
  - type: csv
    path: leads.csv

sequence:
  - channel: linkedin
    wait_days: 0
    brief: connection note under 200 characters naming the specific work of theirs you saw
  - channel: email
    wait_days: 2
    brief: what the role is, why their work fits, salary range if allowed, ask for a 20 minute call
  - channel: email
    wait_days: 5
    brief: same thread; one concrete detail about the team or problem, keep the ask
  - channel: email
    wait_days: 7
    brief: same thread; close the loop and invite them to reach out later

limits:
  new_per_day: 10
  touches_per_day: 30
  per_company: 2
  research_per_run: 20

writing:
  max_words: 130
  banned: ["—", "rockstar", "ninja", "exciting opportunity"]
  rules:
    - reference one specific piece of their work
    - state the role, team and location plainly
    - never pressure; make it easy to say no

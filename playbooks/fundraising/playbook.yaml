# ostack:example. Replace every value below (or run the ostack-setup skill), then delete this line.
name: fundraising
mode: draft
goal: book first meetings with investors who lead rounds at our stage and in our sector

sender:
  name: Your Name
  title: founder and CEO
  email: you@example.com
  signature: |
    your first name

target:
  who: Partners and principals at funds that lead rounds at our stage in our sector
  contact: partner or principal who invests in the sector
  qualify:
    - the fund invests at our stage
    - the person has made or led an investment in our sector in the last 24 months
    - the fund's thesis or portfolio does not include a direct competitor
  exclude:
    - investors already in conversation with us
    - funds that state they do not take cold outreach

sources:
  - type: web
    query: recent rounds in our sector at our stage and the investors who led them
  - type: csv
    path: leads.csv

sequence:
  - channel: email
    wait_days: 0
    brief: one line on the company, one traction fact, why this investor specifically, ask for 20 minutes
  - channel: email
    wait_days: 5
    brief: same thread; one new milestone or fact since the first email
  - channel: email
    wait_days: 10
    brief: same thread; brief final note with the round status

limits:
  new_per_day: 10
  touches_per_day: 25
  per_company: 1
  research_per_run: 15

writing:
  max_words: 120
  banned: ["—", "unicorn", "disrupt", "don't miss"]
  rules:
    - lead with the strongest real metric
    - name the investor's relevant past investment
    - no attachments in the first email

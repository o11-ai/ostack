<text x="56" y="128" font-size="76" font-weight="700" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="-2">o<tspan fill="#4f46e5">stack</tspan></text>
<text x="60" y="172" font-size="20" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Outbound your agent sets up by talking to you.</text>
